<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightlight</title>
<meta name="description" content="A shared baby log for two phones: sleep, feeds, nappies and gentle predictions.">
<meta name="theme-color" content="#EEF1F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nightlight">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preload" href="fonts/AtkinsonHyperlegible-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url("fonts/AtkinsonHyperlegible-Regular.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: swap; src: url("fonts/AtkinsonHyperlegible-Bold.woff2") format("woff2"); }
@font-face { font-family: "Young Serif"; font-weight: 400; font-display: swap; src: url("fonts/YoungSerif-Regular.woff2") format("woff2"); }
:root {
  /* Layout: a bedside instrument. One 560px column: the "now" readout, a ruler of the next few hours, then the log;
     a thumb-zone action bar fixed at the bottom. After dark the whole app dims to umber and amber, like a night light. */
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #18212B;
  --ink-2: #536171;
  --ink-3: #75818E;
  --rule: #D7DDE4;
  --sleep: #4A57B5;
  --sleep-soft: #A9B1E2;
  --sleep-wash: rgba(74, 87, 181, 0.13);
  --feed: #C9790E;
  --nappy: #11907F;
  --pump: #A34C74;
  --care: #5B6B7C;
  --warn: #8F5400;
  --warn-wash: #FFF3DD;
  --alert: #B3261E;
  --alert-wash: #FCE8E6;
  --focus: #4A57B5;
  --scrim: rgba(16, 22, 30, 0.42);
  --shadow: 0 -8px 28px rgba(24, 33, 43, 0.09);
  --toast-bg: #18212B; --toast-ink: #FFFFFF; --toast-line: transparent;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151B23; --surface: #1E2733; --surface-2: #19212B; --ink: #E7ECF2; --ink-2: #A3B0BE; --ink-3: #8592A0; --rule: #2F3A47;
    --sleep: #7A86E0; --sleep-soft: #48508A; --sleep-wash: rgba(122, 134, 224, 0.18); --feed: #C4842C; --nappy: #20A38B; --pump: #D27AA5; --care: #A3B1C0;
    --warn: #E5AC57; --warn-wash: #352A19; --alert: #F2948A; --alert-wash: #3B2321; --focus: #9AA4F0; --scrim: rgba(0, 0, 0, 0.55);
    --shadow: 0 -8px 28px rgba(0, 0, 0, 0.4); --toast-bg: #2C3746; --toast-ink: #E7ECF2; --toast-line: #3C4858;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] { --toast-bg: #2C3746; --toast-ink: #E7ECF2; --toast-line: #3C4858;
  --bg: #151B23; --surface: #1E2733; --surface-2: #19212B; --ink: #E7ECF2; --ink-2: #A3B0BE; --ink-3: #8592A0; --rule: #2F3A47;
  --sleep: #7A86E0; --sleep-soft: #48508A; --sleep-wash: rgba(122, 134, 224, 0.18); --feed: #C4842C; --nappy: #20A38B; --pump: #D27AA5; --care: #A3B1C0;
  --warn: #E5AC57; --warn-wash: #352A19; --alert: #F2948A; --alert-wash: #3B2321; --focus: #9AA4F0; --scrim: rgba(0, 0, 0, 0.55);
  --shadow: 0 -8px 28px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
:root[data-nightlight="on"] {
  --bg: #170D07; --surface: #22150C; --surface-2: #1C110A; --ink: #F0B27A; --ink-2: #C99364; --ink-3: #A27447; --rule: #3B2817;
  --sleep: #A87FD0; --sleep-soft: #5B4470; --sleep-wash: rgba(168, 127, 208, 0.16); --feed: #C4842C; --nappy: #20A38B; --pump: #C9788F; --care: #B8936E;
  --warn: #EBB067; --warn-wash: #33200F; --alert: #F59A7A; --alert-wash: #3A1A10; --focus: #F0B27A; --scrim: rgba(0, 0, 0, 0.6);
  --shadow: 0 -8px 28px rgba(0, 0, 0, 0.55); --toast-bg: #33210F; --toast-ink: #F0B27A; --toast-line: #4A3220;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  transition: background-color 0.6s ease, color 0.6s ease;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
h2 { font: 400 20px/1.2 var(--font-display); text-wrap: balance; }
h3 { font-size: 15px; font-weight: 700; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(104px + env(safe-area-inset-bottom)); background: var(--bg); }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 16px 10px; }
.top h1 { font: 400 26px/1.1 var(--font-display); letter-spacing: -0.005em; text-wrap: balance; }
.top .age { margin-top: 4px; color: var(--ink-2); font-size: 14.5px; }
.top-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); padding: 6px 8px; border-radius: 999px; background: none; border: 0; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.sync[data-s="ok"] i { background: var(--nappy); }
.sync[data-s="busy"] i { background: var(--feed); }
.sync[data-s="warn"] i { background: var(--alert); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); }
.icon-btn svg { width: 22px; height: 22px; }

.tabs { display: flex; gap: 22px; padding: 0 16px; border-bottom: 1px solid var(--rule); }
.tabs button { background: none; border: 0; padding: 10px 0 11px; font-weight: 700; font-size: 15.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.banner { margin: 12px 16px 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--surface-2); border: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.banner.warn { background: var(--warn-wash); border-color: transparent; }
.banner button { flex-shrink: 0; }

/* now panel */
.now { background: var(--surface); padding: 20px 16px 18px; border-bottom: 1px solid var(--rule); }
.state-word { font: 400 21px/1.2 var(--font-display); color: var(--ink-2); }
.hero { font: 700 56px/1.02 var(--font-body); letter-spacing: -0.015em; margin: 4px 0 6px; }
.hero small { font-size: 22px; font-weight: 700; letter-spacing: 0; margin-left: 2px; }
.since { color: var(--ink-2); font-size: 14.5px; }
.ruler { margin: 16px -4px 2px; }
.ruler svg { display: block; width: 100%; height: 70px; overflow: visible; }
.ruler text { font: 11.5px var(--font-body); fill: var(--ink-3); }

.next { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
.next li { display: grid; grid-template-columns: 28px 1fr auto; column-gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--rule); }
.next li:first-child { border-top: 0; }
.next .g { align-self: center; }
.next .what { font-size: 15px; color: var(--ink-2); }
.next .when { font-weight: 700; font-size: 18px; }
.next .rel { font-size: 14px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.next .sub { grid-column: 2 / 4; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

.g { width: 22px; height: 22px; display: inline-block; flex-shrink: 0; }
.g svg { width: 22px; height: 22px; display: block; }

.note { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; background: var(--surface-2); }
.note.warn { background: var(--warn-wash); }
.note.alert { background: var(--alert-wash); }
.note > strong:first-child { display: block; margin-bottom: 2px; }
.note .src { margin-top: 6px; }

/* 24h stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 14px 16px; gap: 0; background: var(--surface-2); }
.stats > div { padding: 0 10px; border-left: 1px solid var(--rule); min-width: 0; }
.stats > div:first-child { border-left: 0; padding-left: 0; }
.stats .k { font-size: 12.5px; color: var(--ink-2); }
.stats .v { font-size: 19px; font-weight: 700; white-space: nowrap; }
.stats .t { font-size: 12px; color: var(--ink-3); }
.stats .t.low { color: var(--warn); font-weight: 700; }
.stats-head { padding: 12px 16px 0; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }

/* log */
.section { padding: 22px 16px 6px; }
.stats + .section, .stats-foot + .section { border-top: 1px solid var(--rule); }
.section > h2 { margin-bottom: 10px; }
.section > .lede { color: var(--ink-2); font-size: 14.5px; margin: -4px 0 12px; max-width: 62ch; }
.day-h { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 14px 0 4px; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { border-top: 1px solid var(--rule); }
.log li:first-child { border-top: 0; }
.row { width: 100%; display: grid; grid-template-columns: 64px 24px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; background: none; border: 0; text-align: left; }
.row .t { font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.row .d { font-size: 15.5px; min-width: 0; }
.row .d span { color: var(--ink-2); }
.row .d em { font-style: normal; font-weight: 700; color: var(--ink); }
.who { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--ink-3); }
.pending-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--feed); margin-left: 6px; vertical-align: middle; }
.more-row { display: flex; justify-content: center; padding: 10px 0 4px; }
.empty { color: var(--ink-2); font-size: 15px; padding: 8px 0 14px; max-width: 60ch; }

/* action bar */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--rule); box-shadow: var(--shadow); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
.actionbar .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.actionbar .inner.one { grid-template-columns: 1fr; }
.act { min-height: 64px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; }
.act .lbl { font-weight: 700; font-size: 14.5px; line-height: 1.1; }
.act .sub { font-size: 12px; color: var(--ink-2); line-height: 1.1; font-variant-numeric: tabular-nums; }
.act.on { border-color: currentColor; }
.act.on.sleep { color: var(--sleep); background: var(--sleep-wash); }
.act.on.sleep .lbl, .act.on.sleep .sub { color: var(--ink); }
.act.on.feed { color: var(--feed); }
.act.on.feed .lbl, .act.on.feed .sub { color: var(--ink); }
.act.big { min-height: 68px; flex-direction: row; gap: 12px; font-size: 17px; }
.act.big .lbl { font-size: 17px; }
.act.big .sub { font-size: 15px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); font-weight: 700; font-size: 16px; text-decoration: none; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { color: var(--alert); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; }
.btn.small { min-height: 38px; font-size: 14.5px; padding: 0 12px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn-row.end { justify-content: flex-end; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14.5px; color: var(--ink-2); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 15px; min-height: 40px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); font-weight: 700; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity 0.18s ease; }
.scrim.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92%; overflow: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow); transform: translateY(16px); opacity: 0; transition: transform 0.2s ease, opacity 0.2s ease; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet.show { transform: none; opacity: 1; }
.sheet .wrap { max-width: 528px; margin: 0 auto; }
.sheet-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 10px; z-index: 1; }
.sheet-head h2 { font-size: 21px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--rule); margin: 8px auto 0; }
.form { display: grid; gap: 14px; padding-bottom: 6px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); font-size: 17px; }
.field textarea { min-height: 84px; resize: vertical; }
.field .hint { font-size: 13px; color: var(--ink-3); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.two > *, .three > * { min-width: 0; }
.field input, .field select { min-width: 0; max-width: 100%; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 40px; }
.check input { width: 22px; height: 22px; }
.err { color: var(--alert); font-size: 14px; font-weight: 700; }

.grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { min-height: 76px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface-2); display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; font-weight: 700; font-size: 16px; }
.tile .tiny { font-weight: 400; display: block; }
.tile.tall { min-height: 96px; flex-direction: column; justify-content: center; align-items: flex-start; }

.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side { min-height: 132px; border-radius: 18px; border: 2px solid var(--rule); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px; }
.side .s { font: 400 30px/1 var(--font-display); }
.side .tm { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.side .st { font-size: 13px; color: var(--ink-2); }
.side.on { border-color: var(--feed); background: var(--surface); }
.side .badge { font-size: 12px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 2px 8px; border-radius: 999px; }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; }
.stepper button { min-height: 56px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface-2); font-size: 22px; font-weight: 700; }
.stepper input { text-align: center; font-size: 30px !important; font-weight: 700; min-height: 56px; }

/* charts */
.chart { margin-top: 6px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 11.5px var(--font-body); fill: var(--ink-3); }
.chart .lbl-strong { fill: var(--ink); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend i.dot { border-radius: 50%; width: 9px; height: 9px; }
.legend i.tick { height: 3px; width: 14px; border-radius: 2px; }
.readout { min-height: 22px; font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
.readout strong { color: var(--ink); }
.hit { fill: transparent; cursor: pointer; }
.hit:focus { outline: none; }
.hit:focus-visible { stroke: var(--focus); stroke-width: 2; }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th, table.t td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--rule); vertical-align: top; }
table.t th { font-weight: 700; color: var(--ink-2); font-size: 13px; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll-x { overflow-x: auto; }

/* guide */
.facts { display: grid; gap: 0; margin: 0; }
.facts > div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid var(--rule); }
.facts > div:first-child { border-top: 0; }
.facts dt { font-weight: 700; font-size: 14.5px; }
.facts dd { margin: 0; font-size: 15px; }
.src { font-size: 12.5px; color: var(--ink-3); }
.src a { color: var(--ink-2); }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 15.5px; max-width: 62ch; }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.lines li:first-child { border-top: 0; }
.lines .nm { font-weight: 700; }
.lines .ph { font-weight: 700; font-size: 17px; white-space: nowrap; text-decoration: none; }
.lines .wh { grid-column: 1 / 3; font-size: 13.5px; color: var(--ink-2); }
.prose { font-size: 15.5px; max-width: 62ch; display: grid; gap: 10px; }
.sources { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 6px; }

/* contractions */
.ctr-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; }
.ctr-stats > div { padding: 0 10px; border-left: 1px solid var(--rule); }
.ctr-stats > div:first-child { border-left: 0; padding-left: 0; }
.ctr-stats .v { font-size: 20px; font-weight: 700; }
.ctr-stats .k { font-size: 12.5px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--rule); }
.pill.warn { background: var(--warn-wash); border-color: transparent; color: var(--ink); }

.toast { position: fixed; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 60; display: flex; justify-content: center; pointer-events: none; }
.toast .in { max-width: 536px; width: 100%; background: var(--toast-bg); color: var(--toast-ink); border: 1px solid var(--toast-line); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); font-size: 15px; transform: translateY(8px); opacity: 0; visibility: hidden; pointer-events: none; transition: transform 0.18s ease, opacity 0.18s ease, visibility 0s linear 0.18s; }

.stats-foot { padding: 0 16px 14px; margin-top: -4px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
.toast button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; min-height: 38px; }

@media (max-width: 380px) {
  .hero { font-size: 48px; }
  .row { grid-template-columns: 58px 22px 1fr auto; gap: 8px; }
  .stats .v { font-size: 17px; }
  .facts > div { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}


/* child switcher in the header */
.kid-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; border-radius: 8px; }
.kid-btn svg { width: 22px; height: 22px; color: var(--ink-3); flex-shrink: 0; margin-top: 2px; }
.kid-btn[disabled] { cursor: default; }
.kid-btn[disabled] svg { display: none; }
.kids { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.kid-row { width: 100%; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface-2); text-align: left; }
.kid-row[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); }
.kid-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-3); }
.kid-row[aria-pressed="true"] .kid-dot { border-color: var(--ink); background: radial-gradient(circle, var(--ink) 0 4px, transparent 5px); }
.kid-main { display: grid; gap: 2px; min-width: 0; }
.kid-nm { font-weight: 700; font-size: 17px; }
.kid-st { font-size: 13.5px; color: var(--ink-2); }
.kid-on { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }

/* type or say */
.qlog { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px; margin: 0 0 6px; padding: 6px 6px 6px 14px; border-radius: 14px; border: 1px dashed var(--ink-3); background: var(--surface); color: var(--ink-2); font-size: 15.5px; text-align: left; }
.qlog-mic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); }
.qlog-mic svg { width: 22px; height: 22px; }
.ql-box { position: relative; }
.ql-box textarea { width: 100%; min-height: 76px; padding: 12px 58px 12px 12px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); font-size: 17px; resize: none; }
.ql-mic { position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface-2); display: grid; place-items: center; color: var(--ink); }
.ql-mic svg { width: 22px; height: 22px; }
.ql-mic.on { background: var(--alert-wash); border-color: var(--alert); color: var(--alert); animation: ql-pulse 1.4s ease-in-out infinite; }
@keyframes ql-pulse { 50% { box-shadow: 0 0 0 6px var(--alert-wash); } }
.ql-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ql-it { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 15px; }

.ql-it.bad { grid-template-columns: 24px 1fr; background: var(--alert-wash); }

.ql-it .d em { font-style: normal; font-weight: 700; color: var(--ink); }
.ql-it .d em.ql-err { color: var(--alert); }
.ql-kid { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); color: var(--ink) !important; margin-right: 2px; }
.ql-ex { font-size: 14.5px; color: var(--ink-2); }
.ql-ex summary { cursor: pointer; font-weight: 700; color: var(--ink); min-height: 40px; display: flex; align-items: center; }
.ql-ex ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

/* plan: schedule creator */
.plan-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.plan-in .field input { min-height: 48px; font-size: 17px; padding: 10px 10px; }
.plan-naps { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }

.p-wake .pd, .p-bed .pd { padding: 8px 0; }

.p-nap .pd strong, .p-bed .pd strong { margin-right: 4px; }
.p-bed .pd strong { color: var(--sleep); }
.plan-sum { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 14px; font-size: 14px; color: var(--ink-2); }
.plan-sum strong { color: var(--ink); }
.plan-src { margin-top: 10px; max-width: 62ch; }
.facts.aw > div { grid-template-columns: 1fr auto; }
.facts.aw dd { font-weight: 700; font-variant-numeric: tabular-nums; }

.ww-k { font-weight: 700; font-size: 15px; }
.ww-row .mini-step output { min-width: 62px; }
.flag { color: var(--warn); font-weight: 700; }

.rm-head { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 15px; }

.toggles { list-style: none; margin: 0; padding: 0; }
.toggles li { padding: 8px 0; border-top: 1px solid var(--rule); display: grid; gap: 6px; }
.toggles li:first-child { border-top: 0; }
.toggles .tiny { margin-left: 32px; }
.small-seg { margin-left: 32px; justify-self: start; flex-wrap: wrap; border-radius: 14px; }
.small-seg button { padding: 6px 11px; font-size: 13.5px; min-height: 34px; }

  ol.plan li { grid-template-columns: 68px 1fr; gap: 10px; }

.top { padding-top: calc(18px + env(safe-area-inset-top)); }
body.sheet-open .toast { top: calc(12px + env(safe-area-inset-top)); }
.sheet { max-height: calc(100% - env(safe-area-inset-top) - 12px); }
[hidden] { display: none !important; }

<script>

    'nsw-newborn': { org: 'NSW Government', title: 'Newborn (birth to 3 months): helplines', url: 'https://www.nsw.gov.au/family-and-relationships/early-child-development/newborn-birth-to-3-months' },
    'rcn-helplines': { org: 'Raising Children Network', title: 'Helplines for parents', url: 'https://raisingchildren.net.au/grown-ups/services-support/services-families/helplines' },

  function ageInfo(profile, now) {
    profile = profile || {};

  }
  function weeksLabel(days) {
    var w = Math.floor(days / 7), r = days % 7;
    if (w === 0) return plural(r, 'day');
    return plural(w, 'week') + (r ? ' ' + plural(r, 'day') : '');

     Under 6 months: blended from Tresillian (newborn 1-2 h incl. feed; 3 mo 1.5-2 h; 5 mo 2-3 h) and Raising Children

  var WW = [ // [weeks, target, low, high] minutes
    [0, 60, 40, 90], [2, 65, 45, 95], [4, 70, 50, 100], [6, 80, 55, 110], [8, 85, 60, 115],
    [10, 95, 70, 125], [12, 105, 80, 135], [16, 120, 90, 150], [20, 140, 105, 170], [26, 155, 120, 180],
    [30, 170, 135, 200], [35, 180, 150, 210], [39, 195, 165, 225], [43, 205, 175, 235], [52, 225, 195, 255],
    [65, 285, 240, 330], [78, 315, 270, 360], [104, 345, 300, 390]

  function interpTable(tbl, x) {
    if (x <= tbl[0][0]) return tbl[0].slice(1);

  }

  function expectations(age, profile) {
    if (!age || !age.born) return null;
    var w = age.basisWeeks, d = age.ageDays;

    var m = S.demo ? { name: id === 'demo-a' ? 'You' : 'Partner', colour: id === 'demo-a' ? '#4A57B5' : '#B8417A' } : (members(ctx)[id] || {});
    var nm = m.name || '';
    var initial = nm ? nm.trim().charAt(0).toUpperCase() : '•';

  function refreshNames() {}

  /* ---------------- shell ---------------- */
  function buildShell() {
    document.getElementById('app').innerHTML =
      '<header class="top"><div><h1><button type="button" class="kid-btn" id="hKid" data-act="kids" aria-haspopup="dialog"><span id="hName">Baby</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h1><p class="age" id="hAge"></p></div>' +
      '<div class="top-right"><button type="button" class="sync" id="hSync" data-act="sync-info" data-s="idle"><i></i><span>Connecting</span></button>' +
      '<button type="button" class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true">' + G.gear + '</svg></button></div></header>' +
      '<nav class="tabs" role="tablist" aria-label="Sections">' +
      TABS.map(function (t) { return '<button type="button" role="tab" id="tab-' + t + '" data-act="tab" data-tab="' + t + '" aria-selected="false">' + TAB_NAMES[t] + '</button>'; }).join('') +
      '</nav><div id="banner"></div><main id="view" role="tabpanel"></main>';
  }
  function renderSoon() {
    // requestAnimationFrame pauses in hidden or background frames, so a timer backs it up
    if (S.renderQueued) return;
    S.renderQueued = true;
    var done = false;
    var run = function () { if (done) return; done = true; S.renderQueued = false; render(); };
    if (window.requestAnimationFrame) window.requestAnimationFrame(run);
    setTimeout(run, 150);
  }
  function render() {
    var c = makeCtx(); S.ctx = c;
    applyNightLight(c);
    if (S.needsSetup && !S.demo) { renderSetup(c); return; }
    document.querySelector('.tabs').hidden = false;
    document.getElementById('hSync').hidden = false;
    renderHeader(c);
    renderBanner(c);
    var v = document.getElementById('view');
    v.removeAttribute('data-view');
    v.setAttribute('aria-labelledby', 'tab-' + S.tab);
    v.innerHTML = S.tab === 'patterns' ? viewPatterns(c) : S.tab === 'guide' ? viewGuide(c) : S.tab === 'plan' ? viewPlan(c) : viewToday(c);
    renderActionBar(c);
    if (S.sheet && S.sheet.live) renderSheet();
    refreshNames(c);
    tick();
    scheduleOutboxSync();
    checkPushSub();
  }
  function applyNightLight(c) {
    var on = S.nightMode === 'on' || (S.nightMode === 'auto' && E.isNight(c.now, c.cfg));
    document.documentElement.setAttribute('data-nightlight', on ? 'on' : 'off');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); if (bg) meta.setAttribute('content', bg); }
  }
  function renderHeader(c) {
    document.getElementById('hName').textContent = c.multi ? kidLabel(c.profile, c.kids) : babyName(c.profile);
    document.getElementById('hKid').disabled = false;
    document.getElementById('hKid').setAttribute('aria-label', (c.multi ? 'Looking after ' : '') + babyName(c.profile) + '. Choose or add a child');
    var a = c.age, line;
    if (a.born) {
      line = E.ageLabel(a, c.now);
      if (a.beforeDue) line += ' · ' + a.pmaWeeks + '+' + a.pmaRem + ' weeks';
      else if (a.preterm) line += ' · ' + E.weeksLabel(a.correctedDays) + ' corrected';
    } else line = a.gestWeeks != null && a.daysToDue >= -21 ? a.gestWeeks + ' weeks + ' + a.gestRem + ' days' : dueLabel(a.due);
    document.getElementById('hAge').textContent = line;
    var st = c.status || {}, s = 'idle', txt = 'Connecting';
    if (S.demo) { s = 'idle'; txt = 'Sample data'; }
    else if (st.mode === 'local') { s = 'idle'; txt = 'This phone only'; }
    else if (st.mode === 'firebase') {
      if (st.readOnly) { s = 'warn'; txt = 'View only'; }
      else if (st.offline) { s = 'warn'; txt = 'Offline'; }
      else if (st.pending) { s = 'busy'; txt = 'Saving'; }
      else if (!st.loaded) { s = 'idle'; txt = 'Connecting'; }
      else if (st.slow) { s = 'warn'; txt = 'Slow to sync'; }
      else { s = 'ok'; txt = 'Synced'; }
    }
    var el = document.getElementById('hSync');
    el.setAttribute('data-s', s); el.querySelector('span').textContent = txt;
    TABS.forEach(function (t) { var b = document.getElementById('tab-' + t); if (b) b.setAttribute('aria-selected', String(S.tab === t)); });
  }
  function renderBanner(c) {
    var st = c.status || {}, html = '';
    if (S.demo) html = '<div class="banner"><span>You’re looking at a made-up 7-week-old. Nothing here is saved.</span><button type="button" class="btn small" data-act="demo-exit">Back to your log</button></div>';
    else if (st.error) html = '<div class="banner warn"><span>' + esc(st.error) + '</span><button type="button" class="btn small" data-act="dismiss-error">OK</button></div>';
    else if (st.mode === 'local') html = '<div class="banner"><span>' + (S.localReason === 'test' ? 'Test mode: entries stay in this browser.' : 'Not connected to a shared database yet, so entries stay on this phone.') + '</span></div>';
    else if (st.mode === 'firebase' && st.offline) html = '<div class="banner"><span>Offline. Entries are saved on this phone and sync when you’re back online.</span></div>';
    else if (st.mode === 'firebase' && st.slow && !st.loaded) html = '<div class="banner warn"><span>Can’t reach the shared log yet. What you add is saved here and syncs when it connects.</span></div>';
    else if (st.mode === 'firebase' && st.slow) html = '<div class="banner warn"><span>This may be out of date: the shared log is slow to respond.</span></div>';
    html += installBanner();
    document.getElementById('banner').innerHTML = html;
  }
  function installBanner() {
    if (S.isStandalone || S.installDismissed) return '';

    if (S.installEvt) return '<div class="banner"><span>Install Nightlight on this phone for the full-screen app.</span><button type="button" class="btn small" data-act="install">Install</button></div>';
    return '';
  }

  /* ---------------- SETUP (first run, or opening a pairing link) ---------------- */
  function renderSetup(c) {

    document.getElementById('hKid').disabled = true;
    document.getElementById('hAge').textContent = 'A shared baby log for two phones';
    document.getElementById('hSync').hidden = true;
    document.querySelector('.tabs').hidden = true;
    document.getElementById('actionbar').hidden = true;
    renderBanner(c);
    var v = document.getElementById('view');
    var key = 'setup-' + (S.joinKey ? 'join' : 'new');
    if (v.getAttribute('data-view') === key) return; // don't wipe what someone is typing
    v.setAttribute('data-view', key);
    var h = '';
    if (S.joinKey) {
      h += '<section class="now"><p class="state-word">You’ve been invited</p><p class="hero" style="font-size:34px;line-height:1.15">Join your partner’s baby log</p><p class="since">Everything either of you logs shows up on both phones.</p></section>';
      if (S.isIOS && !S.isStandalone) h += '<section class="section" style="padding-bottom:0"><div class="note"><strong>First, add Nightlight to your Home Screen</strong>Tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>, and open Nightlight from there to finish joining. Safari and the Home Screen app keep separate storage, so joining here would only set up Safari.</div></section>';
      if (S.family && S.family !== S.joinKey) h += '<section class="section" style="padding-bottom:0"><div class="note warn"><strong>This phone is already on another log</strong>Joining switches it to this one. The other log isn’t deleted.</div></section>';
      h += '<section class="section"><div class="form"><div class="field"><label for="su-name">Your name</label><input id="su-name" type="text" maxlength="40" autocomplete="given-name" placeholder="e.g. Chloe"></div><p class="err" id="f-err" role="alert"></p><div class="btn-row"><button type="button" class="btn primary" data-act="setup-join">Join the log</button></div></div></section>';
    } else {
      h += '<section class="now"><p class="state-word">Welcome</p><p class="hero" style="font-size:34px;line-height:1.15">Set up Nightlight</p><p class="since">Start a log on one phone, then pair the other from Settings.</p></section>';
      h += '<section class="section"><h2>Start a new log</h2><div class="form" style="margin-top:10px">' +
        '<div class="field"><label for="su-name">Your name</label><input id="su-name" type="text" maxlength="40" autocomplete="given-name" placeholder="e.g. Guy"></div>' +
        '<div class="two"><div class="field"><label for="su-surname">Baby’s surname</label><input id="su-surname" type="text" maxlength="60" placeholder="Optional"></div>' +
        '<div class="field"><label for="su-due">Due date</label><input id="su-due" type="date"></div></div>' +
        '<p class="err" id="f-err" role="alert"></p><div class="btn-row"><button type="button" class="btn primary" data-act="setup-new">Start the log</button></div></div></section>';
      h += '<section class="section"><h2>Join your partner’s log</h2><p class="lede">On the phone that started the log, open Settings and choose Pair a phone. Open that link on this phone, or paste it here.</p><div class="form">' +
        '<div class="field"><label for="su-link">Pairing link</label><input id="su-link" type="url" inputmode="url" autocomplete="off" placeholder="https://…#join=…"></div>' +
        '<div class="field"><label for="su-name2">Your name</label><input id="su-name2" type="text" maxlength="40" placeholder="e.g. Chloe"></div>' +
        '<p class="err" id="f-err2" role="alert"></p><div class="btn-row"><button type="button" class="btn" data-act="setup-join-paste">Join</button></div></div></section>';
      h += '<section class="section"><p class="lede">Want to look around first?</p><div class="btn-row"><button type="button" class="btn" data-act="demo">Practise with a sample baby</button></div></section>';
    }
    v.innerHTML = h;
  }

  /* ---------------- TODAY ---------------- */
  function viewToday(c) {
    if (!c.age.born) return viewPrebirth(c);
    var sp = E.predictSleep(c.events, c.now, c.profile, c.age);
    var fp = E.predictFeed(c.events, c.now, c.profile, c.age);
    var st = E.stats24h(c.events, c.now, c.profile);
    var ex = E.expectations(c.age, c.profile);
    var h = '<section class="now">';
    var rf = c.runningFeed;
    if (rf) {
      var mins = E.segMinutes(rf.segments, c.now);
      var open = (rf.segments || []).filter(function (s) { return s.end == null; })[0];
      h += '<p class="state-word">Feeding' + (open ? ' on the ' + (open.side === 'L' ? 'left' : 'right') : ', paused') + '</p>' +
        '<p class="hero"><span data-live="clock" data-since="' + rf.start + '">' + fmtClock(c.now - rf.start) + '</span></p>' +
        '<p class="since">started ' + fmtTime(rf.start) + ' · L ' + fmtDur(mins.L) + ' · R ' + fmtDur(mins.R) + ' · <button type="button" class="linkish" data-act="feed">Open timer</button></p>';
    } else if (sp.state === 'asleep') {
      h += '<p class="state-word">' + (sp.night ? 'Asleep for the night' : 'Asleep') + '</p>' +
        '<p class="hero"><span data-live="hero" data-since="' + sp.since + '">' + heroDur((c.now - sp.since) / MIN) + '</span></p>' +
        '<p class="since">since ' + fmtTime(sp.since) + (sp.night ? '' : ' · nap ' + Math.max(1, sp.napIndex) + ' today') + '</p>';
    } else if (sp.noData && c.live.some(function (e) { return e.type === 'feed' && e.method !== 'solids'; })) {
      var lf = E.feedSessions(c.events, c.now).pop();
      h += '<p class="state-word">Since the last feed</p><p class="hero"><span data-live="hero" data-since="' + lf.start + '">' + heroDur((c.now - lf.start) / MIN) + '</span></p>' +
        '<p class="since">fed at ' + fmtTime(lf.start) + ' · log a sleep to start sleep predictions</p>';
    } else if (sp.noData) {
      h += '<p class="state-word">Welcome, ' + esc(firstName(c.profile)) + '</p><p class="hero" style="font-size:30px;line-height:1.15">Log a sleep or a feed to begin</p>' +
        '<p class="since">Predictions start from the age guide and learn from what you log.</p>';
    } else {
      h += '<p class="state-word">Awake</p>' +
        '<p class="hero"><span data-live="hero" data-since="' + sp.awakeSince + '">' + heroDur((c.now - sp.awakeSince) / MIN) + '</span></p>' +
        '<p class="since">since ' + fmtTime(sp.awakeSince) + ' · after ' + (sp.lastSleepWasNight ? 'a ' + fmtDur(sp.lastSleepMin) + ' sleep' : 'a ' + fmtDur(sp.lastSleepMin) + ' nap') + '</p>';
    }
    h += '<div class="ruler" aria-hidden="true">' + ruler(c, sp, fp) + '</div>';
    h += '<ul class="next">' + nextSleepRow(c, sp, ex) + nextFeedRow(c, fp, ex) + '</ul>';
    h += alerts(c, st, ex, fp);
    h += '</section>';
    h += statsBlock(c, st, ex);
    h += '<section class="section"><h2>Log</h2>' + (c.readOnly ? '' : qlogBar()) + logList(c) + '</section>';
    return h;
  }
  function qlogBar() {
    return '<button type="button" class="qlog" data-act="quicklog"><span>Type or say what happened</span><span class="qlog-mic" aria-hidden="true"><svg viewBox="0 0 24 24">' + G.mic + '</svg></span></button>';
  }
  function nextSleepRow(c, sp, ex) {
    if (sp.state === 'asleep') {
      var napTxt = sp.night ? 'Night sleep' : 'This nap so far';
      return '<li>' + glyph('sleep') + '<div><div class="what">' + napTxt + '</div><div class="when"><span data-live="dur" data-since="' + sp.since + '">' + fmtDur((c.now - sp.since) / MIN) + '</span></div></div><div class="rel"></div>' +
        '<div class="sub">' + (sp.night ? 'Tap Wake up when the night ends or for a night feed.' : esc(ex.naps.text)) + '</div></li>';
    }
    if (sp.noData) {
      return '<li>' + glyph('sleep') + '<div><div class="what">Sleep window</div><div class="when">After your first logged sleep</div></div><div class="rel"></div>' +
        '<div class="sub">At this age most babies are ready to sleep after about ' + fmtDur(ex.awake.low) + ' to ' + fmtDur(ex.awake.high) + ' awake.</div></li>';
    }
    if (sp.kind === 'night') {
      return '<li>' + glyph('sleep') + '<div><div class="what">Night waking</div><div class="when">Back to sleep after the feed</div></div><div class="rel"></div>' +
        '<div class="sub">Keep the lights low and the room quiet so night stays night.</div></li>';
    }
    var label = sp.kind === 'bedtime' ? 'Bedtime window' : sp.kind === 'sleep' ? 'Sleep window' : 'Nap window';
    var rel = sp.status === 'in' ? 'now' : sp.status === 'past' ? 'passed' : fmtRel(sp.windowStart, c.now);
    var conf = sp.confidence === 'custom' ? 'From your own awake times' : sp.confidence === 'personal' ? 'Personalised from ' + sp.pick.nObs + ' awake times' : sp.confidence === 'learning' ? 'Learning your baby’s rhythm' : 'From the age guide until a few sleeps are logged';
    var sub = sp.status === 'past' ? 'Past the usual window. Watch for tired signs and settle when you can.' : sp.status === 'in' ? 'A good time to start winding down.' : conf;
    return '<li>' + glyph('sleep') + '<div><div class="what">' + label + '</div><div class="when">' + fmtRange(sp.windowStart, sp.windowEnd) + '</div></div>' +
      '<div class="rel"' + (sp.status === 'before' ? ' data-live="rel" data-at="' + sp.windowStart + '"' : '') + '>' + rel + '</div>' +
      '<div class="sub">' + esc(sub) + ' · <button type="button" class="linkish" data-act="why" data-k="sleep">Why this time?</button></div></li>';
  }
  function nextFeedRow(c, fp, ex) {
    if (!fp || fp.state === 'feeding') return '';
    if (fp.noData) {
      return '<li>' + glyph('feed') + '<div><div class="what">Next feed</div><div class="when">After your first logged feed</div></div><div class="rel"></div><div class="sub">' + esc(ex.feeds.text) + '</div></li>';
    }
    var last = fp.last, parts = [];
    if (last.L + last.R > 0) parts.push((last.firstSide === 'R' ? ['R', 'L'] : ['L', 'R']).filter(function (sd) { return last[sd] > 0.01; }).map(function (sd) { return sd + ' ' + sideDur(last[sd]); }).join(' · '));
    if (last.ml) parts.push(last.ml + ' mL');
    var side = fp.suggestSide && fp.lastBreast && (c.profile.feeding !== 'formula') ? ' · start on the ' + (fp.suggestSide === 'L' ? 'left' : 'right') : '';
    var rel = fp.status === 'upcoming' ? fmtRel(fp.due, c.now) : fp.status === 'due' ? 'due now' : 'due ' + fmtRel(fp.due, c.now);
    return '<li>' + glyph('feed') + '<div><div class="what">Next feed</div><div class="when">around ' + fmtTime(fp.due) + '</div></div>' +
      '<div class="rel"' + (fp.status === 'upcoming' ? ' data-live="rel" data-at="' + fp.due + '"' : '') + '>' + rel + '</div>' +
      '<div class="sub">Last fed ' + fmtTime(last.start) + (parts.length ? ' · ' + parts.join(' · ') : '') + side + ' · <button type="button" class="linkish" data-act="why" data-k="feed">Why?</button></div></li>';
  }
  function srcLinks(ids) {
    return '<p class="src">' + (ids || []).map(function (id) { var s = E.SOURCES[id]; return s ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.org) + '</a>' : ''; }).filter(Boolean).join(' · ') + '</p>';
  }
  function alerts(c, st, ex, fp) {
    var h = '';
    // fever in the last 6 hours
    var hot = c.live.filter(function (e) { return e.type === 'temp' && e.celsius >= 38 && e.start >= c.now - 6 * HOUR; }).sort(function (a, b) { return b.start - a.start; })[0];
    if (hot) h += feverNote(c.age, hot.celsius, hot.start);
    if (c.runningSleep && c.now - c.runningSleep.start > 14 * HOUR) h += '<div class="note warn"><strong>The sleep timer has run ' + fmtDur((c.now - c.runningSleep.start) / MIN) + '</strong>Did someone forget to tap Wake up? <button type="button" class="linkish" data-act="edit" data-id="' + esc(c.runningSleep.id) + '">Fix the times</button></div>';
    if (c.runningFeed && c.now - c.runningFeed.start > 2 * HOUR) h += '<div class="note warn"><strong>The feed timer has run ' + fmtDur((c.now - c.runningFeed.start) / MIN) + '</strong><button type="button" class="linkish" data-act="feed">Open the timer to finish it</button></div>';
    if (fp && fp.wakeHint && c.runningSleep) h += '<div class="note"><strong>' + fmtDur(fp.sinceLast / MIN) + ' since the last feed</strong>Until babies are back to birth weight (usually within 2 weeks), they’re usually woken for a feed every 3 to 4 hours. Follow your midwife’s advice.' + srcLinks(['kidshealth-wake', 'qld-enough-milk']) + '</div>';
    if (ex.nappies.minWet != null && c.age.dayOfLife >= 2 && st.coverageH >= 20 && st.wet < ex.nappies.minWet) {
      h += '<div class="note warn"><strong>Fewer wet nappies than expected</strong>' + st.wet + ' wet in the last 24 hours; at this age expect at least ' + ex.nappies.minWet + '. Check feeding, and contact your midwife, child health nurse or GP if it continues, if the wee is dark, or if your baby seems unwell.' + srcLinks(ex.nappies.src) + '</div>';
    }
    return h;
  }
  function feverNote(age, celsius, at) {
    var under3 = age.born && age.basisDays < 91 && age.ageDays < 91;
    var under12 = age.born && age.ageDays < 365;
    var what = under3 ? 'Under 3 months with a temperature of 38°C or higher: go to the nearest hospital emergency department now.' :
      under12 ? '3 to 12 months with a temperature of 38°C or higher: see a doctor straight away.' :
        'See a doctor if your child has a fever and seems unwell, is drowsy, isn’t drinking or weeing enough, or it lasts more than 2 days.';
    return '<div class="note alert" role="alert"><strong>' + celsius.toFixed(1) + '°C' + (at ? ' at ' + fmtTime(at) : '') + '</strong>' + what +
      ' Call 000 for an ambulance if your baby is drowsy, floppy or struggling to breathe. Not sure? Call healthdirect on 1800 022 222 (24 hours).' + srcLinks(['healthdirect-fever-chart', 'healthdirect-fever', 'pbb-fever']) + '</div>';
  }
  function statsBlock(c, st, ex) {
    var cover = st.coverageH < 23.5;
    var first = c.live.reduce(function (m, e) { return Math.min(m, e.start); }, Infinity);
    var head = 'Last 24 hours' + (cover && isFinite(first) ? ' (logging since ' + (E.calDays(first, c.now) ? fmtDate(first) + ' ' : '') + fmtTime(first) + ')' : '');
    var wetLow = ex.nappies.minWet != null && c.age.dayOfLife >= 2 && st.coverageH >= 20 && st.wet < ex.nappies.minWet;
    var extra = [];
    if (st.longestMin) extra.push('Longest sleep ' + fmtDur(st.longestMin));
    if (st.breastMin) extra.push('breastfeeding ' + fmtDur(st.breastMin));
    if (st.bottleMl) extra.push('bottles ' + st.bottleMl + ' mL');
    if (st.pumpMl) extra.push('pumped ' + st.pumpMl + ' mL');
    return '<p class="stats-head">' + head + '</p><section class="stats" aria-label="Last 24 hours">' +
      '<div><div class="k">Sleep</div><div class="v">' + fmtDur(st.sleepMin) + '</div><div class="t">usual ' + ex.sleep.low + '–' + ex.sleep.high + 'h</div></div>' +
      '<div><div class="k">Feeds</div><div class="v">' + st.feeds + '</div></div>' +
      '<div><div class="k">Wet</div><div class="v">' + st.wet + '</div>' + (ex.nappies.minWet != null ? '<div class="t' + (wetLow ? ' low' : '') + '">' + (wetLow ? 'below ' : 'at least ') + ex.nappies.minWet + '</div>' : '') + '</div>' +
      '<div><div class="k">Dirty</div><div class="v">' + st.dirty + '</div></div>' +
      '</section>' + (extra.length ? '<p class="stats-foot">' + extra.join(' · ') + '</p>' : '');
  }
  function describe(e, c) {
    var t = e.type, note = e.note ? ' <span>· ' + esc(e.note.length > 60 ? e.note.slice(0, 60) + '…' : e.note) + '</span>' : '';
    if (t === 'sleep') {
      if (e.end == null) return '<em>Sleeping</em> <span>since ' + fmtTime(e.start) + ' · <span data-live="dur" data-since="' + e.start + '">' + fmtDur((c.now - e.start) / MIN) + '</span></span>' + note;
      return '<em>Sleep</em> <span>' + fmtRange(e.start, e.end) + ' · ' + fmtDur((e.end - e.start) / MIN) + (e.where ? ' · ' + esc(WHERE[e.where] || e.where) : '') + '</span>' + note;
    }
    if (t === 'feed') {
      if (e.method === 'bottle') return '<em>Bottle</em> <span>' + (e.amountMl != null ? e.amountMl + ' mL' : '') + (e.milk ? ' ' + (e.milk === 'formula' ? 'formula' : 'breast milk') : '') + '</span>' + note;
      if (e.method === 'solids') return '<em>Solids</em> <span>' + esc(e.foods || '') + '</span>' + note;
      var m = E.segMinutes(e.segments, c.now);

      case 'toggle-end': { var w = document.getElementById('end-wrap'); if (w) w.hidden = el.checked; break; }
      case 'step': { var f = document.getElementById('f-ml'); if (f) f.value = Math.max(0, Math.min(500, (Number(f.value) || 0) + Number(el.getAttribute('data-d')))); break; }
      case 'preset': { var f2 = document.getElementById('f-ml'); if (f2) f2.value = el.getAttribute('data-v'); break; }
      case 'why': openSheet('why', { k: el.getAttribute('data-k') }); break;
      case 'day': openSheet('day', { key: el.getAttribute('data-key') }); break;
      case 'readout': { var ch = el.getAttribute('data-chart'); S.readout[ch] = Number(el.getAttribute('data-i')); render(); break; }
      case 'table': { var ch2 = el.getAttribute('data-chart'); S.table[ch2] = !S.table[ch2]; render(); break; }
      case 'pdays': S.patternsDays = Number(el.getAttribute('data-n')); S.readout = {}; render(); break;
      case 'log-more': S.logExpanded = true; render(); break;
      case 'log-less': S.logExpanded = false; render(); break;
      case 'toast': { var a = S.toastActions && S.toastActions[Number(el.getAttribute('data-i'))]; hideToast(); if (a) a.fn(); break; }
      case 'nightmode': S.nightMode = el.getAttribute('data-v'); try { localStorage.setItem('nl-nightlight', S.nightMode); } catch (e2) {} render(); renderSheet(); break;
      case 'demo': enterDemo(); break;
      case 'demo-exit': exitDemo(); break;
      case 'setup-new': setupNew(); break;
      case 'setup-join': setupJoin(S.joinKey, strVal('su-name'), 'f-err'); break;
      case 'setup-join-paste': { var mk = /(?:join=)?([A-Za-z0-9]{24,64})\s*$/.exec(strVal('su-link')); setupJoin(mk && mk[1], strVal('su-name2'), 'f-err2'); break; }
      case 'pair': openSheet('pair'); break;
      case 'share-link': try { navigator.share({ title: 'Nightlight', text: 'Join our baby log on Nightlight', url: pairLink() }).catch(function () {}); } catch (e3) { copyText(pairLink(), 'Link copied'); } break;
      case 'copy-link': copyText(pairLink(), 'Link copied'); break;
      case 'install': if (S.installEvt) { var ie = S.installEvt; S.installEvt = null; ie.prompt(); render(); } break;
      case 'install-dismiss': S.installDismissed = true; try { localStorage.setItem('nl-install-later', '1'); } catch (e4) {} render(); break;
      case 'leave': {
        if (S.delArm !== 'leave') { S.delArm = 'leave'; renderSheet(); setTimeout(function () { if (S.delArm === 'leave') { S.delArm = null; if (S.sheet) renderSheet(); } }, 4000); break; }
        try { localStorage.removeItem('nl-family'); localStorage.removeItem('nl-member'); localStorage.removeItem('nl-child'); } catch (e5) {}
        location.hash = ''; location.reload(); break;
      }
      case 'download-csv': {
        var c1 = makeCtx();
        Promise.resolve(S.store.exportAll ? S.store.exportAll() : c1.d).then(function (data) {
          var blob = new Blob([csv(data, c1)], { type: 'text/csv' });
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nightlight-' + E.dayKey(Date.now()) + '.csv';
          document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        }, function () { toast('Couldn’t export right now. Try again when online.'); });
        break;
      }
      case 'dismiss-error': if (S.store && S.store.status) { S.store.status.error = null; render(); } break;
      case 'copy-summary': copyText(buildSummary(makeCtx()), 'Summary copied'); break;
      case 'copy-csv': {
        var c0 = makeCtx();
        Promise.resolve(S.store.exportAll ? S.store.exportAll() : c0.d).then(function (data) { copyText(csv(data, c0), 'All entries copied as CSV'); }, function () { copyText(csv(c0.d, c0), 'Entries from the last 5 weeks copied as CSV'); });
        break;
      }
      case 'ctr-start': if (!guard()) break; st().addContraction({ id: B.uid(), start: Date.now(), end: null, by: me() }).catch(handleErr); break;
      case 'ctr-stop': { var r = E.contractionStats(makeCtx().d.contractions || [], Date.now()).running; if (r) st().patchContraction(r.id, { end: Date.now() }).catch(handleErr); break; }
      case 'ctr-del': st().removeContraction(id).catch(handleErr); break;
      case 'ctr-clear': {
        if (S.delArm !== 'ctr-clear') { S.delArm = 'ctr-clear'; render(); setTimeout(function () { if (S.delArm === 'ctr-clear') { S.delArm = null; render(); } }, 4000); break; }
        S.delArm = null; st().clearContractions().catch(handleErr); break;
      }
    }
  }
  function onKey(ev) {
    if (ev.key === 'Escape' && S.sheet) { stopDictation(); closeSheet(); return; }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'ql-text' && !ev.shiftKey) { ev.preventDefault(); qlSave(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.tagName.toLowerCase() !== 'button') {
      ev.preventDefault(); onClick({ target: ev.target });
    }
  }
  function onInput(ev) {
    if (ev.target && ev.target.id === 'ql-text') { clearTimeout(S.qlTimer); S.qlTimer = setTimeout(qlRender, 120); return; }
    if (ev.target && ev.target.id === 'f-c') {
      var v = Number(String(ev.target.value).replace(',', '.'));
      var box = document.getElementById('fever-live');
      if (box) box.innerHTML = isFinite(v) && v >= 38 && v <= 45 ? feverNote(S.ctx.age, v, null) : '';
    }
  }

  /* ---------------- setup actions ---------------- */
  function saveIds() {
    try { localStorage.setItem('nl-family', S.family); localStorage.setItem('nl-member', S.member); return true; }
    catch (e) { toast('This browser won’t keep the pairing. Use Safari or Chrome, not private browsing.'); return false; }
  }
  function clearJoinHash() { try { history.replaceState(null, '', location.pathname + location.search + '#' + S.tab); } catch (e) {} }
  function readJoinKey() { var m = /(?:^|[#&?])join=([A-Za-z0-9]{24,64})/.exec(location.hash + '&' + location.search); return m ? m[1] : null; }
  function setupNew() {
    var name = strVal('su-name');
    if (!name) return setErr('Add your name, so each of you can see who logged what.');
    var due = strVal('su-due');
    if (due && !/^\d{4}-\d{2}-\d{2}$/.test(due)) return setErr('Check the due date.');
    S.family = B.randomId(28); S.member = B.randomId(12);
    saveIds();
    startStore();
    var profile = { surname: strVal('su-surname'), name: '', feeding: 'unsure', dayStart: '07:00', nightStart: '19:00' };
    if (due) profile.dueDate = due;
    st().saveProfile(profile).catch(handleErr);
    st().setMember(name, B.MEMBER_COLOURS[0]).catch(handleErr);
    S.needsSetup = false; S.joinKey = null; clearJoinHash();
    render(); window.scrollTo(0, 0);
    toast('Your log is ready. Pair your partner’s phone from Settings.');
  }
  function setupJoin(key, name, errId) {
    var err = function (m) { var el = document.getElementById(errId); if (el) el.textContent = m; };
    if (!key || !/^[A-Za-z0-9]{24,64}$/.test(key)) return err('That doesn’t look like a pairing link. Copy it again from Settings, Pair a phone.');
    if (!name) return err('Add your name, so each of you can see who logged what.');
    S.family = key; S.member = B.randomId(12);
    saveIds();
    startStore();
    st().setMember(name).catch(handleErr);
    S.needsSetup = false; S.joinKey = null; clearJoinHash();
    render(); window.scrollTo(0, 0);
    toast('Joined. Everything you log now shows on both phones.');
  }
  function useLocal(reason) {
    S.localReason = reason;
    S.realStore = new B.MemoryStore(null, { persistKey: 'nl-local-v1', mode: 'local' });
    if (!S.demo) S.store = S.realStore;
    S.realStore.subscribe(renderSoon);
  }
  function startStore() {
    if (!S.fb) { useLocal('no-db'); return; }
    var fs = new B.FirebaseStore(S.fb, S.family, S.member);
    S.realStore = fs; if (!S.demo) S.store = fs;
    fs.subscribe(renderSoon); fs.init();
  }
  function connect() {
    var cfg = window.NIGHTLIGHT_CONFIG, local = /[?&]local=1/.test(location.search);
    try { S.family = localStorage.getItem('nl-family'); S.member = localStorage.getItem('nl-member'); } catch (e) {}
    if (!local && cfg && cfg.projectId && window.NLFirebase) {
      try { S.fb = window.NLFirebase.connect(cfg); } catch (e) { S.fb = null; }
    }
    if (!S.fb) { useLocal(local ? 'test' : 'no-config'); render(); return; }
    var key = readJoinKey();
    if (key && key === S.family && S.member) clearJoinHash();
    else if (key) { S.joinKey = key; S.needsSetup = true; }
    if (!S.family || !S.member) S.needsSetup = true;
    if (!S.needsSetup) startStore();
    render();
  }
  function start() {
    var h = (location.hash || '').replace('#', '');
    S.tab = TABS.indexOf(h) >= 0 ? h : 'today';
    try { S.nightMode = localStorage.getItem('nl-nightlight') || 'auto'; S.installDismissed = !!localStorage.getItem('nl-install-later'); S.child = localStorage.getItem('nl-child'); } catch (e) { S.nightMode = 'auto'; }
    S.isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    S.isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    buildShell();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('input', onInput);
    document.addEventListener('change', function (ev) {
      var t = ev.target;
      if (!t) return;
      if (t.id === 'f-running') { var w = document.getElementById('end-wrap'); if (w) w.hidden = t.checked; }
      var pk = t.getAttribute && t.getAttribute('data-pref');
      if (pk) { var pp = {}; pp[pk] = pk === 'only' ? (t.checked ? curKid() : null) : t.checked; savePrefs(pp); setTimeout(function () { if (S.sheet) renderSheet(); }, 60); }
      var pl = t.getAttribute && t.getAttribute('data-plan');
      if (pl) { var v = fromHM(t.value); if (v != null) { planState(makeCtx())[pl] = v; if (pl === 'wake') planState(makeCtx()).fromToday = false; render(); } }
    });
    window.addEventListener('hashchange', function () {
      var t = (location.hash || '').replace('#', '');
      if (readJoinKey() && readJoinKey() !== S.family) { S.joinKey = readJoinKey(); S.needsSetup = true; render(); return; }
      if (TABS.indexOf(t) >= 0 && t !== S.tab) { S.tab = t; render(); }
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
    window.addEventListener('resize', function () { clearTimeout(S.rz); S.rz = setTimeout(render, 200); });
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.installEvt = e; renderSoon(); });
    window.addEventListener('appinstalled', function () { S.installEvt = null; renderSoon(); });
    setInterval(tick, 1000);
    if ('serviceWorker' in navigator && window.isSecureContext && !/[?&]nosw=1/.test(location.search)) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      navigator.serviceWorker.ready.then(function (reg) { S.swReg = reg; checkPushSub(); }).catch(function () {});
    }
    setInterval(function () { if (!document.hidden) scheduleOutboxSync(0); }, 5 * 60000);
    connect();
  }
  window.__bft = { S: S, render: render, enterDemo: enterDemo, reminderItems: reminderItems, snap: snap, syncOutbox: syncOutbox, qlParse: qlParse };
  start();
})();

</script>
