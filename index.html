  }
  function buildSummary(c) {
    var days = E.dailyStats(c.events, c.now, c.profile, 8).filter(function (d) { return !d.partial && d.hasData; }).slice(-7);
    var L = [babyName(c.profile) + ': summary to ' + fmtLongDate(c.now)];
    if (c.age.born) L.push('Age: ' + E.ageLabel(c.age, c.now) + (c.age.preterm ? ' (corrected ' + E.weeksLabel(c.age.correctedDays) + ')' : '') + '; born ' + fmtLongDate(c.age.birth));
    if (days.length) {
      var avg = function (k) { return days.reduce(function (s, d) { return s + (d[k] || 0); }, 0) / days.length; };
      L.push('Over the last ' + days.length + ' full days (per day, ' + fmtHour(E.atLocal(c.now, c.cfg.dayStartMin, 0)) + ' to ' + fmtHour(E.atLocal(c.now, c.cfg.dayStartMin, 0)) + '):');
      L.push('- Sleep: ' + fmtDur(avg('totalMin')) + ' (night ' + fmtDur(avg('nightMin')) + ', day ' + fmtDur(avg('dayMin')) + '), ' + avg('naps').toFixed(1) + ' naps, longest night stretch ' + fmtDur(avg('longestNightMin')));
      L.push('- Feeds: ' + avg('feeds').toFixed(1) + (avg('bottleMl') ? ', bottles ' + Math.round(avg('bottleMl')) + ' mL' : '') + (avg('breastMin') ? ', breastfeeding ' + fmtDur(avg('breastMin')) : ''));
      L.push('- Nappies: ' + avg('wet').toFixed(1) + ' wet, ' + avg('dirty').toFixed(1) + ' dirty');
    }
    var g = (c.d.growth || []).filter(function (x) { return x.weightKg; }).sort(function (a, b) { return a.at - b.at; });
    if (g.length) L.push('Weight: ' + g.slice(-4).map(function (x) { return fmtKg(x.weightKg) + ' on ' + fmtDate(x.at); }).join('; '));
    var temps = c.live.filter(function (e) { return e.type === 'temp' && e.start >= c.now - 7 * DAY; });
    if (temps.length) L.push('Temperatures (7 days): ' + temps.map(function (e) { return e.celsius.toFixed(1) + '°C ' + fmtDate(e.start) + ' ' + fmtTime(e.start); }).join('; '));
    var meds = c.live.filter(function (e) { return e.type === 'med' && e.start >= c.now - 7 * DAY; });
    if (meds.length) L.push('Medicines (7 days): ' + meds.map(function (e) { return e.name + (e.dose ? ' ' + e.dose : '') + ' ' + fmtDate(e.start) + ' ' + fmtTime(e.start); }).join('; '));
    return L.join('\n');
  }
  function csv(data, c) {
    function q(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = [['type', 'start', 'end', 'minutes', 'details', 'note', 'logged_by']];
    E.live(data.events).sort(function (a, b) { return a.start - b.start; }).forEach(function (e) {
      var det = '';
      if (e.type === 'feed') { if (e.method === 'breast') { var m = E.segMinutes(e.segments, Date.now()); det = 'breast L ' + Math.round(m.L) + 'm R ' + Math.round(m.R) + 'm'; } else if (e.method === 'bottle') det = 'bottle ' + (e.amountMl || '') + ' mL ' + (e.milk || ''); else det = 'solids ' + (e.foods || ''); }
      else if (e.type === 'nappy') det = (e.wet ? 'wet ' : '') + (e.dirty ? 'dirty ' : '') + (e.colour || '');
      else if (e.type === 'pump') det = 'L ' + (e.leftMl || 0) + ' mL R ' + (e.rightMl || 0) + ' mL';
      else if (e.type === 'temp') det = e.celsius + ' C ' + (e.site || '');
      else if (e.type === 'med') det = e.name + ' ' + (e.dose || '');
      else if (e.type === 'sleep') det = e.where || '';
      rows.push([e.type, toInput(e.start).replace('T', ' '), e.end ? toInput(e.end).replace('T', ' ') : '', e.end ? Math.round((e.end - e.start) / MIN) : '', det.trim(), e.note || '', nameOf(e.by, c)]);
    });
    (data.growth || []).forEach(function (g) { rows.push(['growth', toInput(g.at).replace('T', ' '), '', '', [g.weightKg ? g.weightKg + ' kg' : '', g.lengthCm ? g.lengthCm + ' cm long' : '', g.headCm ? g.headCm + ' cm head' : ''].filter(Boolean).join(' '), g.note || '', nameOf(g.by, c)]); });
    return rows.map(function (r) { return r.map(q).join(','); }).join('\n');
  }
  function copyText(text, okMsg) {
    var done = function () { toast(okMsg); };
    try {
      navigator.clipboard.writeText(text).then(done, function () { openSheet('copy', { text: text }); });
    } catch (e) { openSheet('copy', { text: text }); }
  }
  function enterDemo() {
    S.demoStore = new B.MemoryStore(E.sampleData(Date.now(), { weeks: 7 }), { mode: 'demo', me: 'demo-a' });
    S.store = S.demoStore; S.demo = true;
    S.demoStore.subscribe(renderSoon);
    if (S.sheet) closeSheet();
    S.tab = 'today'; location.hash = 'today';
    render(); window.scrollTo(0, 0);
    toast('Sample baby loaded. Try the buttons; nothing is saved.');
  }
  function exitDemo() {
    S.demo = false; S.store = S.realStore; S.demoStore = null;
    if (S.sheet) closeSheet();
    render(); window.scrollTo(0, 0);
  }

  function onClick(ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) { if (ev.target.id === 'scrim') closeSheet(); return; }
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (act !== 'del' && act !== 'del-growth' && act !== 'feed-discard' && act !== 'ctr-clear' && act !== 'leave' && S.delArm) { S.delArm = null; }
    switch (act) {
      case 'tab': S.tab = el.getAttribute('data-tab'); location.hash = S.tab; render(); window.scrollTo(0, 0); break;
      case 'settings': openSheet('settings'); break;
      case 'sync-info': openSheet('sync'); break;
      case 'close': closeSheet(); break;
      case 'sleep': if (!guard()) break; if (makeCtx().runningSleep) wakeUp(); else startSleep(); break;
      case 'feed': if (!guard()) break; openSheet('feed', makeCtx().runningFeed ? { tab: 'breast' } : {}); break;
      case 'feedtab': S.sheet.tab = el.getAttribute('data-tab'); S.sheet.live = S.sheet.tab === 'breast'; renderSheet(); break;
      case 'nappy': if (!guard()) break; openSheet('nappy'); break;
      case 'more': if (!guard()) break; openSheet('more'); break;
      case 'nappy-quick': quickNappy(el.getAttribute('data-k')); break;
      case 'side': tapSide(el.getAttribute('data-side')); break;
      case 'feed-finish': finishFeed(); break;
      case 'feed-discard': {
        if (S.delArm !== 'discard') { S.delArm = 'discard'; renderSheet(); setTimeout(function () { if (S.delArm === 'discard') { S.delArm = null; if (S.sheet) renderSheet(); } }, 4000); break; }
        S.delArm = null; var rf = makeCtx().runningFeed; if (rf) st().removeEvent(rf.id).catch(handleErr); closeSheet(); toast('Feed discarded'); break;
      }
      case 'add': {
        var type = el.getAttribute('data-type');
        if (type === 'growth') openSheet('form', { type: 'growth', growth: null });
        else openSheet('form', { type: type, ev: null });
        break;
      }
      case 'edit': openEdit(id); break;
      case 'edit-growth': { var g = (makeCtx().d.growth || []).filter(function (x) { return x.id === id; })[0]; if (g) { S.delArm = null; openSheet('form', { type: 'growth', growth: g }); } break; }
      case 'save': saveForm(); break;
      case 'save-settings': saveSettings(); break;
      case 'save-born': saveBorn(); break;
      case 'born': if (!guard()) break; openSheet('born'); break;
      case 'del': case 'del-growth': {
        if (S.delArm !== id) { S.delArm = id; el.textContent = 'Tap again to delete'; setTimeout(function () { if (S.delArm === id) { S.delArm = null; if (document.contains(el)) el.textContent = 'Delete'; } }, 4000); break; }
        S.delArm = null;
        if (act === 'del') { st().removeEvent(id).catch(handleErr); closeSheet(); toast('Deleted', [{ label: 'Undo', fn: function () { st().patchEvent(id, { deleted: false }).catch(handleErr); } }]); }
        else { st().removeGrowth(id).catch(handleErr); closeSheet(); toast('Measurement deleted'); }
        break;
      }
      case 'chip': {
        var group = el.closest('.chips');
        if (group && group.getAttribute('data-multi')) el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true'));
        else if (group) {
          var was = el.getAttribute('aria-pressed') === 'true';
          group.querySelectorAll('.chip').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          if (!was || group.getAttribute('data-field') === 'kind' || group.getAttribute('data-field') === 'first' || group.getAttribute('data-field') === 'milk') el.setAttribute('aria-pressed', 'true');
        }
        break;
      }
      case 'ago': { var inp = document.getElementById(el.getAttribute('data-target')); if (inp) inp.value = toInput(floorMin(Date.now()) - Number(el.getAttribute('data-min')) * MIN); break; }
      case 'toggle-end': { var w = document.getElementById('end-wrap'); if (w) w.hidden = el.checked; break; }
      case 'step': { var f = document.getElementById('f-ml'); if (f) f.value = Math.max(0, Math.min(500, (Number(f.value) || 0) + Number(el.getAttribute('data-d')))); break; }
      case 'preset': { var f2 = document.getElementById('f-ml'); if (f2) f2.value = el.getAttribute('data-v'); break; }
      case 'why': openSheet('why', { k: el.getAttribute('data-k') }); break;
      case 'day': openSheet('day', { key: el.getAttribute('data-key') }); break;
      case 'readout': { var ch = el.getAttribute('data-chart'); S.readout[ch] = Number(el.getAttribute('data-i')); render(); break; }
      case 'table': { var ch2 = el.getAttribute('data-chart'); S.table[ch2] = !S.table[ch2]; render(); break; }
      case 'pdays': S.patternsDays = Number(el.getAttribute('data-n')); S.readout = {}; render(); break;
      case 'log-more': S.logExpanded = true; render(); break;
      case 'log-less': S.logExpanded = false; render(); break;
      case 'toast': { var a = S.toastActions && S.toastActions[Number(el.getAttribute('data-i'))]; hideToast(); if (a) a.fn(); break; }
      case 'nightmode': S.nightMode = el.getAttribute('data-v'); try { localStorage.setItem('nl-nightlight', S.nightMode); } catch (e2) {} render(); renderSheet(); break;
      case 'demo': enterDemo(); break;
      case 'demo-exit': exitDemo(); break;
      case 'setup-new': setupNew(); break;
      case 'setup-join': setupJoin(S.joinKey, strVal('su-name'), 'f-err'); break;
      case 'setup-join-paste': { var mk = /(?:join=)?([A-Za-z0-9]{24,64})\s*$/.exec(strVal('su-link')); setupJoin(mk && mk[1], strVal('su-name2'), 'f-err2'); break; }
      case 'pair': openSheet('pair'); break;
      case 'share-link': try { navigator.share({ title: 'Nightlight', text: 'Join our baby log on Nightlight', url: pairLink() }).catch(function () {}); } catch (e3) { copyText(pairLink(), 'Link copied'); } break;
      case 'copy-link': copyText(pairLink(), 'Link copied'); break;
      case 'install': if (S.installEvt) { var ie = S.installEvt; S.installEvt = null; ie.prompt(); render(); } break;
      case 'install-dismiss': S.installDismissed = true; try { localStorage.setItem('nl-install-later', '1'); } catch (e4) {} render(); break;
      case 'leave': {
        if (S.delArm !== 'leave') { S.delArm = 'leave'; renderSheet(); setTimeout(function () { if (S.delArm === 'leave') { S.delArm = null; if (S.sheet) renderSheet(); } }, 4000); break; }
        try { localStorage.removeItem('nl-family'); localStorage.removeItem('nl-member'); } catch (e5) {}
        location.hash = ''; location.reload(); break;
      }
      case 'download-csv': {
        var c1 = makeCtx();
        Promise.resolve(S.store.exportAll ? S.store.exportAll() : c1.d).then(function (data) {
          var blob = new Blob([csv(data, c1)], { type: 'text/csv' });
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nightlight-' + E.dayKey(Date.now()) + '.csv';
          document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        }, function () { toast('Couldn’t export right now. Try again when online.'); });
        break;
      }
      case 'dismiss-error': if (S.store && S.store.status) { S.store.status.error = null; render(); } break;
      case 'copy-summary': copyText(buildSummary(makeCtx()), 'Summary copied'); break;
      case 'copy-csv': {
        var c0 = makeCtx();
        Promise.resolve(S.store.exportAll ? S.store.exportAll() : c0.d).then(function (data) { copyText(csv(data, c0), 'All entries copied as CSV'); }, function () { copyText(csv(c0.d, c0), 'Entries from the last 5 weeks copied as CSV'); });
        break;
      }
      case 'ctr-start': if (!guard()) break; st().addContraction({ id: B.uid(), start: Date.now(), end: null, by: me() }).catch(handleErr); break;
      case 'ctr-stop': { var r = E.contractionStats(makeCtx().d.contractions || [], Date.now()).running; if (r) st().patchContraction(r.id, { end: Date.now() }).catch(handleErr); break; }
      case 'ctr-del': st().removeContraction(id).catch(handleErr); break;
      case 'ctr-clear': {
        if (S.delArm !== 'ctr-clear') { S.delArm = 'ctr-clear'; render(); setTimeout(function () { if (S.delArm === 'ctr-clear') { S.delArm = null; render(); } }, 4000); break; }
        S.delArm = null; st().clearContractions().catch(handleErr); break;
      }
    }
  }
  function onKey(ev) {
    if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.tagName.toLowerCase() !== 'button') {
      ev.preventDefault(); onClick({ target: ev.target });
    }
  }
  function onInput(ev) {
    if (ev.target && ev.target.id === 'f-c') {
      var v = Number(String(ev.target.value).replace(',', '.'));
      var box = document.getElementById('fever-live');
      if (box) box.innerHTML = isFinite(v) && v >= 38 && v <= 45 ? feverNote(S.ctx.age, v, null) : '';
    }
  }

  /* ---------------- setup actions ---------------- */
  function saveIds() {
    try { localStorage.setItem('nl-family', S.family); localStorage.setItem('nl-member', S.member); return true; }
    catch (e) { toast('This browser won’t keep the pairing. Use Safari or Chrome, not private browsing.'); return false; }
  }
  function clearJoinHash() { try { history.replaceState(null, '', location.pathname + location.search + '#' + S.tab); } catch (e) {} }
  function readJoinKey() { var m = /(?:^|[#&?])join=([A-Za-z0-9]{24,64})/.exec(location.hash + '&' + location.search); return m ? m[1] : null; }
  function setupNew() {
    var name = strVal('su-name');
    if (!name) return setErr('Add your name, so each of you can see who logged what.');
    var due = strVal('su-due');
    if (due && !/^\d{4}-\d{2}-\d{2}$/.test(due)) return setErr('Check the due date.');
    S.family = B.randomId(28); S.member = B.randomId(12);
    saveIds();
    startStore();
    var profile = { surname: strVal('su-surname'), name: '', feeding: 'unsure', dayStart: '07:00', nightStart: '19:00' };
    if (due) profile.dueDate = due;
    st().saveProfile(profile).catch(handleErr);
    st().setMember(name, B.MEMBER_COLOURS[0]).catch(handleErr);
    S.needsSetup = false; S.joinKey = null; clearJoinHash();
    render(); window.scrollTo(0, 0);
    toast('Your log is ready. Pair your partner’s phone from Settings.');
  }
  function setupJoin(key, name, errId) {
    var err = function (m) { var el = document.getElementById(errId); if (el) el.textContent = m; };
    if (!key || !/^[A-Za-z0-9]{24,64}$/.test(key)) return err('That doesn’t look like a pairing link. Copy it again from Settings, Pair a phone.');
    if (!name) return err('Add your name, so each of you can see who logged what.');
    S.family = key; S.member = B.randomId(12);
    saveIds();
    startStore();
    st().setMember(name).catch(handleErr);
    S.needsSetup = false; S.joinKey = null; clearJoinHash();
    render(); window.scrollTo(0, 0);
    toast('Joined. Everything you log now shows on both phones.');
  }
  function useLocal(reason) {
    S.localReason = reason;
    S.realStore = new B.MemoryStore(null, { persistKey: 'nl-local-v1', mode: 'local' });
    if (!S.demo) S.store = S.realStore;
    S.realStore.subscribe(renderSoon);
  }
  function startStore() {
    if (!S.fb) { useLocal('no-db'); return; }
    var fs = new B.FirebaseStore(S.fb, S.family, S.member);
    S.realStore = fs; if (!S.demo) S.store = fs;
    fs.subscribe(renderSoon); fs.init();
  }
  function connect() {
    var cfg = window.NIGHTLIGHT_CONFIG, local = /[?&]local=1/.test(location.search);
    try { S.family = localStorage.getItem('nl-family'); S.member = localStorage.getItem('nl-member'); } catch (e) {}
    if (!local && cfg && cfg.projectId && window.NLFirebase) {
      try { S.fb = window.NLFirebase.connect(cfg); } catch (e) { S.fb = null; }
    }
    if (!S.fb) { useLocal(local ? 'test' : 'no-config'); render(); return; }
    var key = readJoinKey();
    if (key && key === S.family && S.member) clearJoinHash();
    else if (key) { S.joinKey = key; S.needsSetup = true; }
    if (!S.family || !S.member) S.needsSetup = true;
    if (!S.needsSetup) startStore();
    render();
  }
  function start() {
    var h = (location.hash || '').replace('#', '');
    S.tab = TABS.indexOf(h) >= 0 ? h : 'today';
    try { S.nightMode = localStorage.getItem('nl-nightlight') || 'auto'; S.installDismissed = !!localStorage.getItem('nl-install-later'); } catch (e) { S.nightMode = 'auto'; }
    S.isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    S.isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    buildShell();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('input', onInput);
    document.addEventListener('change', function (ev) { if (ev.target && ev.target.id === 'f-running') { var w = document.getElementById('end-wrap'); if (w) w.hidden = ev.target.checked; } });
    window.addEventListener('hashchange', function () {
      var t = (location.hash || '').replace('#', '');
      if (readJoinKey() && readJoinKey() !== S.family) { S.joinKey = readJoinKey(); S.needsSetup = true; render(); return; }
      if (TABS.indexOf(t) >= 0 && t !== S.tab) { S.tab = t; render(); }
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
    window.addEventListener('resize', function () { clearTimeout(S.rz); S.rz = setTimeout(render, 200); });
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.installEvt = e; renderSoon(); });
    window.addEventListener('appinstalled', function () { S.installEvt = null; renderSoon(); });
    setInterval(tick, 1000);
    if ('serviceWorker' in navigator && window.isSecureContext && !/[?&]nosw=1/.test(location.search)) navigator.serviceWorker.register('sw.js').catch(function () {});
    connect();
  }
  window.__bft = { S: S, render: render, enterDemo: enterDemo };
  start();
})();

</script>
